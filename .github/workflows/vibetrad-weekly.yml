name: Vibetrad ugekørsel

# Kører på knaptryk (Run workflow / knappen i Vibetrad). Den automatiske lørdagskørsel
# er slået fra, indtil repo-variablen VT_SCHEDULE sættes til "on".
# Hver kørsel starter med et datatjek, der krydstjekker porteføljens tal mellem
# Vibe-Tradings egne kilder og EODHD (secret EODHD_API_KEY).
# Lørdag kl. 08:00 svensk tid. GitHub-cron er UTC og kender ikke sommertid,
# så der fyres både 06:00 UTC (= 08:00 sommertid) og 07:00 UTC (= 08:00 vintertid).
# run_week.py springer over, hvis klokken i Stockholm er før 08:00, eller ugen
# allerede er kørt. 09:30 UTC er et sikkerhedsnet, hvis GitHub var forsinket
# eller den første kørsel fejlede.
on:
  schedule:
    - cron: "0 6 * * 6"
    - cron: "0 7 * * 6"
    - cron: "30 9 * * 6"
  workflow_dispatch:
    inputs:
      plan:
        description: "fuld = alle relevante teams, kerne = kun risiko + CIO"
        type: choice
        options: [fuld, kerne]
        default: fuld
      budget_usd:
        description: "Maks. forbrug for denne kørsel i USD (tom = standard 35). Månedsloftet gælder stadig."
        type: string
        default: ""
      monthly_slot:
        description: "Månedens ekstra team ved manuel kørsel: 1 ETF, 2 makro/valuta, 3 fondsvalg, 4 værdikomité, 5 idéjagt (tom = det team, der længst tid ikke har kørt)"
        type: string
        default: ""
      dry_run:
        description: "Tørkørsel uden LLM-kald (tester kæden gratis)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vibetrad-weekly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PYTHONUNBUFFERED: "1"
      TZ: Europe/Stockholm
      VIBE_TRADING_HOME: /tmp/vibe-trading
      LANGCHAIN_PROVIDER: anthropic
      LANGCHAIN_MODEL_NAME: ${{ vars.VT_MODEL || 'claude-sonnet-5' }}
      ANTHROPIC_BASE_URL: https://api.anthropic.com
      ANTHROPIC_MAX_TOKENS: "16384"
      VT_PLAN: ${{ inputs.plan || vars.VT_PLAN || 'fuld' }}
      VT_MAX_SWARMS: ${{ vars.VT_MAX_SWARMS || '6' }}
      VT_SCHEDULE: ${{ vars.VT_SCHEDULE || 'off' }}
      VT_RUN_BUDGET_USD: ${{ inputs.budget_usd || vars.VT_RUN_BUDGET_USD || '35' }}
      VT_MONTHLY_BUDGET_USD: ${{ vars.VT_MONTHLY_BUDGET_USD || '95' }}
      # Max-abonnementets API-kredit fornyes d. 23. (faktureringsdagen); månedsloftet følger den.
      VT_BUDGET_RESET_DAY: ${{ vars.VT_BUDGET_RESET_DAY || '23' }}
      VT_CIO_RESERVE_USD: ${{ vars.VT_CIO_RESERVE_USD || '8' }}
      VT_SWARM_TIMEOUT_MIN: ${{ vars.VT_SWARM_TIMEOUT_MIN || '40' }}
      VT_EARNINGS_DAYS: ${{ vars.VT_EARNINGS_DAYS || '14' }}
      VT_SKIP_PRESETS: ${{ vars.VT_SKIP_PRESETS || '' }}
      VT_PRICE_IN_PER_MTOK: ${{ vars.VT_PRICE_IN_PER_MTOK || '2' }}
      VT_PRICE_OUT_PER_MTOK: ${{ vars.VT_PRICE_OUT_PER_MTOK || '10' }}
      VT_MONTHLY_SLOT: ${{ inputs.monthly_slot || '' }}
      VT_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      VT_DATATJEK: ${{ vars.VT_DATATJEK || 'on' }}
    steps:
      - uses: actions/checkout@v5

      - name: Skal der køres?
        id: gate
        run: python3 runner/run_week.py --results results --event "${{ github.event_name }}" --gate-only

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.ran == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer Vibe-Trading
        if: steps.gate.outputs.ran == 'true' && env.VT_DRY_RUN != 'true'
        run: pip install --quiet -r requirements.txt

      - name: Installer kryptering (tørkørsel)
        if: steps.gate.outputs.ran == 'true' && env.VT_DRY_RUN == 'true'
        run: pip install --quiet "cryptography>=42" pyyaml

      - name: Kør Vibe-Trading swarms
        id: run
        if: steps.gate.outputs.ran == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VT_PORTFOLIO: ${{ secrets.VT_PORTFOLIO }}
          VT_RESULTS_PASSPHRASE: ${{ secrets.VT_RESULTS_PASSPHRASE }}
          # EODHD: anden datakilde til datatjekket og agenterne (valgfri, men anbefalet).
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          # FRED: gratis nøgle, der låser Vibe-Tradings get_macro_series op til makro-desken (valgfri).
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python runner/run_week.py --results results --event "${{ github.event_name }}"

      - name: Gem krypteret resultat
        if: steps.run.outputs.ran == 'true'
        run: |
          git config user.name "vibetrad-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -m "Ugerapport ${{ steps.run.outputs.week }} (${{ steps.run.outputs.status }}${{ env.VT_DRY_RUN == 'true' && ', tørkørsel' || '' }})" || exit 0
          # Er main ændret under kørslen (fx en kodeændring), afvises push. Så hentes main, og
          # resultat-commit'et lægges ovenpå (results/ ændres kun af denne workflow). Op til 5 forsøg.
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:main && exit 0
            echo "Push afvist (forsøg $i af 5) – henter nyeste main og prøver igen"
            git pull -q --rebase origin main || { git rebase --abort; echo "Kunne ikke lægge resultatet oven på main"; exit 1; }
            sleep $((i * 5))
          done
          exit 1

      # Sikkerhedsnet: den krypterede rapport gemmes også på kørslen i 14 dage, så en kørsel til
      # op til 35 USD aldrig går tabt, selv hvis push fejler. Hent den under kørslens "Artifacts".
      - name: Backup af krypteret resultat
        if: always() && steps.run.outputs.ran == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: vibetrad-resultat-${{ steps.run.outputs.run_id || github.run_id }}
          path: |
            results/latest.enc.json
            results/index.json
            results/ledger.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Marker fejl
        if: steps.run.outputs.status == 'failed'
        run: |
          echo "Ingen swarms gennemført. Lås rapporten op i Vibetrad for detaljer."
          exit 1
