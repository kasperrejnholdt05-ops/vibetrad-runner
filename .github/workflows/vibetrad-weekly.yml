name: Vibetrad ugekørsel

# Kører på knaptryk (Run workflow / knappen i Vibetrad). Den automatiske lørdagskørsel
# er slået fra, indtil repo-variablen VT_SCHEDULE sættes til "on".
# Hver kørsel starter med et datatjek, der krydstjekker porteføljens tal mellem
# Vibe-Tradings egne kilder og EODHD (secret EODHD_API_KEY).
# Lørdag kl. 08:00 svensk tid. GitHub-cron er UTC og kender ikke sommertid,
# så der fyres både 06:00 UTC (= 08:00 sommertid) og 07:00 UTC (= 08:00 vintertid).
# run_week.py springer over, hvis klokken i Stockholm er før 08:00, eller ugen
# allerede er kørt. 09:30 UTC er et sikkerhedsnet, hvis GitHub var forsinket
# eller den første kørsel fejlede.
# Kanariefuglen: hver nat kl. 03:30 UTC (05:30 sommertid / 04:30 vintertid) kører den samme
# kæde som en gratis tørkørsel (runner/kanarie.py): secrets, Anthropic-nøgle og model, Vibe-Trading-
# installation, EODHD, datatjek, regnskabsdatoer, FRED, makro, kryptering og push. Den skriver kun
# results/canary.json + results/canary/latest.enc.json – aldrig ugerapporterne. Fejler et tjek,
# bliver kørslen rød, og GitHub sender den sædvanlige fejlmail. Kører uanset VT_SCHEDULE.
on:
  schedule:
    - cron: "0 6 * * 6"
    - cron: "0 7 * * 6"
    - cron: "30 9 * * 6"
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      plan:
        description: "fuld = alle relevante teams, kerne = kun risiko + CIO, strategi = byg porteføljen fra kontant (7 teams, mandat fra Vibetrad → Plan)"
        type: choice
        options: [fuld, kerne, strategi]
        default: fuld
      budget_usd:
        description: "Maks. forbrug for denne kørsel i USD (tom = standard 35). Månedsloftet gælder stadig."
        type: string
        default: ""
      monthly_budget_usd:
        description: "Månedsloft for denne kørsel i USD (tom = repo-variablen VT_MONTHLY_BUDGET_USD eller 95). Hæv det kun, når Anthropic-kreditten faktisk rækker."
        type: string
        default: ""
      monthly_slot:
        description: "Månedens ekstra team ved manuel kørsel: 1 ETF, 2 makro/valuta, 3 fondsvalg, 4 værdikomité, 5 idéjagt (tom = det team, der længst tid ikke har kørt)"
        type: string
        default: ""
      dry_run:
        description: "Tørkørsel uden LLM-kald (tester kæden gratis)"
        type: boolean
        default: false
      canary:
        description: "Kanariefugl nu: samme gratis tjek af hele kæden som den natlige (skriver kun results/canary.json)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vibetrad-weekly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PYTHONUNBUFFERED: "1"
      TZ: Europe/Stockholm
      VIBE_TRADING_HOME: /tmp/vibe-trading
      LANGCHAIN_PROVIDER: anthropic
      LANGCHAIN_MODEL_NAME: ${{ vars.VT_MODEL || 'claude-sonnet-5' }}
      ANTHROPIC_BASE_URL: https://api.anthropic.com
      ANTHROPIC_MAX_TOKENS: "16384"
      VT_PLAN: ${{ inputs.plan || vars.VT_PLAN || 'fuld' }}
      VT_MAX_SWARMS: ${{ vars.VT_MAX_SWARMS || '6' }}
      VT_SCHEDULE: ${{ vars.VT_SCHEDULE || 'off' }}
      VT_RUN_BUDGET_USD: ${{ inputs.budget_usd || vars.VT_RUN_BUDGET_USD || '35' }}
      VT_MONTHLY_BUDGET_USD: ${{ inputs.monthly_budget_usd || vars.VT_MONTHLY_BUDGET_USD || '95' }}
      # Max-abonnementets API-kredit fornyes d. 23. (faktureringsdagen); månedsloftet følger den.
      VT_BUDGET_RESET_DAY: ${{ vars.VT_BUDGET_RESET_DAY || '23' }}
      VT_CIO_RESERVE_USD: ${{ vars.VT_CIO_RESERVE_USD || '8' }}
      VT_SWARM_TIMEOUT_MIN: ${{ vars.VT_SWARM_TIMEOUT_MIN || '40' }}
      VT_EARNINGS_DAYS: ${{ vars.VT_EARNINGS_DAYS || '14' }}
      VT_SKIP_PRESETS: ${{ vars.VT_SKIP_PRESETS || '' }}
      VT_PRICE_IN_PER_MTOK: ${{ vars.VT_PRICE_IN_PER_MTOK || '2' }}
      VT_PRICE_OUT_PER_MTOK: ${{ vars.VT_PRICE_OUT_PER_MTOK || '10' }}
      VT_MONTHLY_SLOT: ${{ inputs.monthly_slot || '' }}
      VT_CANARY: ${{ (inputs.canary || github.event.schedule == '30 3 * * *') && 'true' || 'false' }}
      VT_DRY_RUN: ${{ (inputs.dry_run || inputs.canary || github.event.schedule == '30 3 * * *') && 'true' || 'false' }}
      VT_DATATJEK: ${{ vars.VT_DATATJEK || 'on' }}
      # Vibe-Tradings web_search må ikke falde tilbage på kinesiske søgemaskiner.
      VIBE_TRADING_SEARCH_BING_FALLBACK: "0"
    steps:
      # ref: main → altid nyeste main, også for en kørsel, der har stået i kø bag en anden (ellers læses
      # results/ fra et gammelt træ, og ugen køres igen). persist-credentials: false → GitHub-tokenet
      # ligger ikke i .git/config, mens Vibe-Trading og dens afhængigheder kører.
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Skal der køres?
        id: gate
        run: python3 runner/run_week.py --results results --event "${{ github.event_name }}" --gate-only

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.ran == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Kanariefuglen installerer også Vibe-Trading: så opdages det, hvis requirements.txt ikke længere kan løses.
      - name: Installer Vibe-Trading
        if: steps.gate.outputs.ran == 'true' && (env.VT_DRY_RUN != 'true' || env.VT_CANARY == 'true')
        run: pip install --quiet -r requirements.txt

      - name: Installer kryptering (tørkørsel)
        if: steps.gate.outputs.ran == 'true' && env.VT_DRY_RUN == 'true' && env.VT_CANARY != 'true'
        run: pip install --quiet "cryptography>=42" pyyaml

      - name: Kør Vibe-Trading swarms
        id: run
        if: steps.gate.outputs.ran == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VT_PORTFOLIO: ${{ secrets.VT_PORTFOLIO }}
          VT_RESULTS_PASSPHRASE: ${{ secrets.VT_RESULTS_PASSPHRASE }}
          # EODHD: anden datakilde til datatjekket og agenterne (valgfri, men anbefalet).
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          # FRED: gratis nøgle, der låser Vibe-Tradings get_macro_series op til makro-desken (valgfri).
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python runner/run_week.py --results results --event "${{ github.event_name }}"

      - name: Gem krypteret resultat
        if: steps.run.outputs.ran == 'true'
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT_FILE: ${{ steps.run.outputs.result_file }}
          COMMIT_MSG: ${{ env.VT_CANARY == 'true' && format('Kanariefugl {0} ({1})', steps.run.outputs.day, steps.run.outputs.status) || format('Ugerapport {0} ({1}{2})', steps.run.outputs.week, steps.run.outputs.status, env.VT_DRY_RUN == 'true' && ', tørkørsel' || '') }}
        run: |
          git config user.name "vibetrad-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cp "$RESULT_FILE" "$RUNNER_TEMP/kuvert.enc.json"
          git add results
          git commit -q -m "$COMMIT_MSG" || exit 0
          # Er main ændret under kørslen (en kodeændring eller en anden kørsels resultat), afvises push.
          # Så startes forfra fra nyeste main, og kuverten lægges ind igen (index, ledger og latest
          # flettes af runneren, så to kørslers resultater aldrig overskriver hinanden). Op til 5 forsøg.
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:main && exit 0
            echo "Push afvist (forsøg $i af 5) – henter nyeste main og lægger resultatet ind igen"
            sleep $((i * 5))
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 runner/run_week.py --results results --merge-results "$RUNNER_TEMP/kuvert.enc.json" || exit 1
            git add results
            git commit -q -m "$COMMIT_MSG" || exit 0
          done
          echo "Kunne ikke gemme resultatet i repoet. Kuverten ligger som artifact på kørslen."
          exit 1

      # Sikkerhedsnet: den krypterede rapport gemmes også på kørslen i 14 dage, så en kørsel til
      # op til 35 USD aldrig går tabt, selv hvis push fejler. Hent den under kørslens "Artifacts".
      - name: Backup af krypteret resultat
        if: always() && steps.run.outputs.ran == 'true' && env.VT_CANARY != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: vibetrad-resultat-${{ steps.run.outputs.run_id || github.run_id }}
          path: |
            results/latest.enc.json
            results/index.json
            results/ledger.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Marker fejl
        if: steps.run.outputs.status == 'failed'
        run: |
          if [ "$VT_CANARY" = "true" ]; then
            echo "Kanariefuglen fandt en fejl i kæden – se tjekkene i loggen ovenfor og i results/canary.json."
          else
            echo "Ingen swarms gennemført. Lås rapporten op i Vibetrad for detaljer."
          fi
          exit 1
