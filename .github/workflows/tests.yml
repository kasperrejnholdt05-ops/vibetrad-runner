name: Tests
on:
  push:
    paths: ["runner/**", "tests/**", "requirements.txt", ".github/workflows/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: pip install --quiet pyyaml pytest
      # Python-testene + de fælles testvektorer for zonemotoren (samme facit i Python og JavaScript).
      - run: python -m pytest -q
