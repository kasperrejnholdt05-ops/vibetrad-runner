name: Tests
on:
  push:
    paths: ["runner/**", "tests/**", "tools/**", "requirements.txt", ".github/workflows/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install --quiet "cryptography>=42" pyyaml pytest pandas
      - run: python -m pytest -q

  # EODHD-integrationen testes mod det rigtige vibe-trading-ai (samme version som ugekørslen).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install --quiet -r requirements.txt pytest
      - run: python -m pytest -q tests/test_eodhd.py
        env:
          VIBE_TRADING_HOME: /tmp/vibe-trading
